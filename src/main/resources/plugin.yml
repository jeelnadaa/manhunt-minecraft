name: Manhunt
version: 1.0.0
main: com.manhunt.ManhuntPlugin
api-version: 1.20
authors: [Antigravity]
description: Advanced Manhunt game mode plugin for PaperMC
commands:
  manhunt:
    description: Main command for Manhunt
    aliases: [mh]
    permission: manhunt.admin
    usage: /manhunt [subcommand]
permissions:
  manhunt.admin:
    description: Allows administrative control over Manhunt
    default: op
